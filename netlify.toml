[build]
  functions = "netlify/functions"
  publish = "."
  # Genera data/opere.json dai file in content/opere/*.json (prototipo CMS,
  # Fase 3). Se lo script fallisce (JSON non valido, campo obbligatorio
  # mancante), il build si ferma e il deploy precedente resta online: vedi
  # scripts/build-opere.js.
  command = "node scripts/build-opere.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; img-src * data: blob:; connect-src 'self' https://api.notion.com; frame-src 'self' https://www.openstreetmap.org;"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# CSP dedicata al pannello /admin (Decap CMS, prototipo Fase 3). Non
# modifica la policy del sito pubblico sopra, che resta invariata.
# NON VERIFICATA dal vivo in questo ambiente (nessun accesso a Internet nel
# sandbox di sviluppo): gli host di Decap Turbo e Cloudinary elencati sono
# dedotti dalla documentazione ufficiale, non osservati da un browser reale.
# Primo collaudo: aprire /admin, controllare la console del browser per
# errori "Content Security Policy" e aggiungere qui gli host mancanti.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src * data: blob:; connect-src 'self' https://unpkg.com https://api.github.com https://api.cloudinary.com https://*.cloudinary.com https://*.decapcms.org https://*.supabase.co; frame-src 'self' https://*.cloudinary.com; worker-src 'self' blob:;"
