[build]
  publish = "dist"
  # Legge content/opere/*.json, genera il catalogo pubblico filtrato per
  # stato e assembla dist/ con solo i file destinati al dominio pubblico
  # (vedi scripts/build.js per l'elenco esatto). Se lo script fallisce
  # (JSON non valido, campo obbligatorio mancante), il build si ferma e il
  # deploy precedente resta online.
  command = "node scripts/build.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; img-src * data: blob:; connect-src 'self' https://*.supabase.co; frame-src 'self' https://www.openstreetmap.org;"

# Supabase CMS at /admin. No Cloudinary, Decap, or third-party CMS scripts.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; frame-src 'none'; object-src 'none';"
