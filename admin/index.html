<body>
<!--
  Pannello amministrativo proprietario (Supabase Auth + Postgres + Storage).
  Sostituisce Decap CMS. Vedi README-SUPABASE.md nella root del repository
  per lo stato di collaudo, le variabili d'ambiente richieste e i passaggi
  di attivazione.

  Finché /admin (Decap CMS) resta attivo, questo pannello vive a un
  indirizzo separato (/admin) e non lo sostituisce: è così di proposito,
  per non disattivare un sistema funzionante prima del collaudo completo di
  questo.
-->
<div id="app" aria-live="polite">Caricamento…</div>

<!--
  Versione bloccata invece della precedente "@2" flottante: una versione
  maggiore non bloccata può cambiare contenuto da un giorno all'altro senza
  alcuna modifica in questo repository (rischio di supply-chain). 2.112.4 è
  una versione che risulta realmente pubblicata da fonti indipendenti
  (jsr.io, che specchia le stesse release npm di @supabase/supabase-js)
  consultate in fase di audit di sicurezza — non inventata — ma in questo
  ambiente di sviluppo non è stato possibile raggiungere jsdelivr.net per
  caricarla davvero e confermarlo (nessun accesso a Internet nel sandbox).
  PRIMA DI CONSIDERARE QUESTO COLLAUDATO: aprire /admin e controllare che la
  pagina non mostri "Impossibile caricare il pannello" (vedi app.js) e che
  la console non segnali 404 su questo script. Se la versione risultasse
  non più disponibile, aggiornare il numero consultando
  https://www.npmjs.com/package/@supabase/supabase-js?activeTab=versions.
  Per un irrigidimento ulteriore (facoltativo), aggiungere un attributo
  integrity="sha384-..." generato dal file scaricato davvero: non incluso
  qui perché un hash indovinato bloccherebbe il pannello invece di
  proteggerlo.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<script src="/supabase-config.js"></script>
<script src="validazione.js"></script>
<script src="app.js"></script>
</body>
</html>
