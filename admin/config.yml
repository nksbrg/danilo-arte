# ============================================================================
# Decap CMS — configurazione del prototipo (Fase 3, ILO | Fuori di Tela)
#
# QUESTO FILE NON FUNZIONA ANCORA "DA SOLO": contiene 3 valori segnati
# "DA CONFIGURARE" che vanno impostati da un umano con accesso a GitHub,
# Decap Turbo e Cloudinary, come descritto in README-CMS.md nella root del
# repository. Fino ad allora il pannello /admin non si collegherà a nulla.
# ============================================================================

backend:
  name: turbo-github
  repo: nksbrg/danilo-arte
  # Branch principale collegato al deploy automatico Netlify.
  branch: main
  # ID del sito creato nella dashboard Decap Turbo (decapcms.org/turbo) dopo
  # aver installato la Decap Turbo GitHub App su questo repository.
  # DA CONFIGURARE — vedi README-CMS.md, passo 1.
  turbo_site_id: "c000d9c5-95dc-4100-a5ec-e9c4b51af8cb"

# Interfaccia in italiano. Da verificare dal vivo: non è stato possibile
# controllare in questo ambiente se la localizzazione "it" copre tutte le
# stringhe dell'interfaccia nella versione di Decap CMS in uso.
locale: "it"

site_url: https://DA-CONFIGURARE.netlify.app
display_url: https://DA-CONFIGURARE.netlify.app
logo_url: /assets/test-opere/opera-prova-1.jpg

# Libreria media Cloudinary: l'upload e la selezione delle foto avvengono
# dentro Decap, senza copiare URL a mano. cloud_name e api_key NON sono
# segreti (sono già visibili pubblicamente in qualunque sito che li usa) e
# possono stare in questo file. L'API secret di Cloudinary NON va MAI
# inserito qui né in nessun file del repository.
# DA CONFIGURARE — vedi README-CMS.md, passo 2.
media_library:
  name: cloudinary
  config:
    cloud_name: "dxympa7bf"
    api_key: "743655346173772"
    multiple: false

collections:
  - name: opere
    label: "Le mie opere"
    label_singular: "Opera"
    description: "Le opere pubblicate, in bozza o nascoste sul sito."
    folder: content/opere
    create: true
    # Niente eliminazione dal pannello: un'opera si nasconde (campo Stato),
    # non si cancella. Evita perdite accidentali di dati.
    delete: false
    format: json
    slug: "{{slug}}"
    summary: "{{titolo}} — {{stato}}"
    sortable_fields: ["ordine", "titolo", "anno", "stato"]
    fields:
      - label: "Fotografia principale"
        name: immagine
        widget: image
        required: true
        hint: "Obbligatoria. Carica la foto dal computer o dal telefono."
        media_library:
          config:
            multiple: false

      - label: "Titolo"
        name: titolo
        widget: string
        required: true

      - label: "Tecnica"
        name: tecnica
        widget: string
        required: false
        hint: "Esempio: acrilico su tela, tecnica mista"

      - label: "Dimensioni"
        name: dimensioni
        widget: string
        required: false
        hint: "Esempio: 80 × 60 cm"

      - label: "Anno"
        name: anno
        widget: number
        value_type: int
        required: false

      - label: "Descrizione"
        name: descrizione
        widget: text
        required: false

      - label: "Ordine di visualizzazione"
        name: ordine
        widget: number
        value_type: int
        default: 0
        required: false
        hint: "Numero più basso = opera mostrata prima nella galleria."

      - label: "Stato"
        name: stato
        widget: select
        required: true
        default: bozza
        hint: "Pubblicata = visibile sul sito. Bozza e Nascosta non sono visibili."
        options:
          - { label: "Bozza (non ancora visibile)", value: bozza }
          - { label: "Pubblicata (visibile sul sito)", value: pubblicata }
          - { label: "Nascosta (rimossa dal sito, dati conservati)", value: nascosta }
